{% comment %}
Chip-инпут для поля "Тэги" на Alpine.js. Ожидает в контексте переменную `form`
(используется form.tags.value как CSV-строка с текущими тэгами).
{% endcomment %}
<div class="col-12" x-data="chipInput('{{ form.tags.value|default:'' }}', 'tags')">
  <label class="field-label">Тэги</label>
  <div class="d-flex flex-wrap mb-2">
    <template x-for="(tag, idx) in items" :key="idx">
      <span class="tag-chip">
        <span x-text="tag"></span>
        <span class="tag-remove" @click="removeItem(idx)"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
      </span>
    </template>
  </div>
  <input type="text" class="field-control" style="width:100%" placeholder="Введите тэг и нажмите Enter"
         x-model="draft" @keydown.enter.prevent="addItem()">
  {{ form.tags }}
</div>
