{% extends "ip_plan/base.html" %}
{% load ip_plan_extras %}

{% block extra_scripts %}
  {% vite_asset "ip_plan/static_src/ip_table/main.jsx" %}
{% endblock %}

{% block content %}
  <!-- До завершения инициализации DataTables сервер показывал бы все
       колонки видимыми, без восстановленных из localStorage ширин и с
       нулевой статистикой в шапке — накрываем спиннером на весь экран,
       чтобы пользователь увидел только готовый результат (убирается в JS,
       см. revealTableAfterFirstLoad()). Важно: НЕ внутри .table-wrapper —
       у неё backdrop-filter, а это свойство создаёт новый containing
       block для position:fixed у потомков, и оверлей "прибился" бы к
       границам именно .table-wrapper (которая до пагинации DataTables
       может быть огромной высоты — все 1000+ строк рисует сервер), а не
       к реальному вьюпорту. -->
  <div class="table-loading-overlay" id="table-loading-overlay">
    <div class="spinner-ring"></div>
    <span>Загрузка таблицы…</span>
  </div>
  <section class="hero">
    <div class="hero-title-row">
      <h1 class="title">IP план</h1>
      <button type="button" class="btn-add"
              hx-get="{% url 'ip_plan:ip_add' %}"
              hx-target="#modal-content"
              hx-indicator="#modal-spinner"
              @click="$store.modal.dirty = false; $dispatch('open-modal')">
        + Добавить IP
      </button>
    </div>
    <div class="hero-stats">
      <span class="hero-stat"><strong id="stat-total">0</strong> Всего IP</span>
      <span class="hero-stat-sep"></span>
      <span class="hero-stat"><strong id="stat-active">0</strong> Активных</span>
      <span class="hero-stat-sep"></span>
      <span class="hero-stat"><strong id="stat-inactive">0</strong> Неактивных</span>
      <span class="hero-stat-sep"></span>
      <div class="hero-actions-row">
        <button type="button" class="btn-help"
                hx-get="{% url 'ip_plan:os_catalog_manage' %}"
                hx-target="#modal-content"
                hx-indicator="#modal-spinner"
                @click="$store.modal.dirty = false; $dispatch('open-modal')"
                title="Справочник «Операционная система»">
          🖴
        </button>
        <button type="button" class="btn-help"
                hx-get="{% url 'ip_plan:help_modal' %}"
                hx-target="#modal-content"
                hx-indicator="#modal-spinner"
                @click="$store.modal.dirty = false; $dispatch('open-modal')"
                title="Справка">
          ?
        </button>
        <a class="btn-help" href="{% url 'ip_plan:acl_lookup' %}" title="Поиск по ACL Cisco-устройств">🛡</a>
        <a class="btn-help" href="{% url 'ip_plan:export_excel' %}" title="Экспорт в Excel">⇩</a>
      </div>
    </div>
  </section>

  <!-- Тулбар + таблица + пагинация — React/TanStack Table (см.
       docs/plans/2026-09-03-ip-table-react-design.md). Данные — fetch к
       /ip/list.json (views.ip_list_json), а не серверный рендер: сервер
       эту часть страницы больше не готовит вообще, только hero-секцию
       выше и модалки (ip_add_modal.html и т.д., по-прежнему HTMX, не
       связаны с этим root'ом). -->
  <div id="ip-table-root"></div>
{% endblock %}
