<tr id="entry-row-{{ entry.id }}">
  <td><span class="tag-chip">{{ entry.get_kind_display }}</span></td>
  <td class="ip-mono">{{ entry.value }}</td>
  <td>
    {% if entry.status == "active" %}
      <span class="badge-status" data-status="active">активна</span>
    {% else %}
      <span class="badge-status" data-status="deprecated"
            title="{% if entry.revoked_reason %}{{ entry.revoked_reason }}{% endif %}">
        снята{% if entry.revoked_at %} {{ entry.revoked_at|date:"d.m.Y" }}{% endif %}
      </span>
    {% endif %}
  </td>
  <td class="cell-muted">{{ entry.created_at|date:"d.m.Y" }}</td>
  <td class="regulator-entry-actions">
    {% if entry.status == "active" %}
      <button type="button" class="btn-modal-secondary btn-sm"
              hx-get="{% url 'ip_plan:regulator_entry_revoke' entry.id %}?return_document_id={{ document.id }}"
              hx-target="#modal-content" hx-indicator="#modal-spinner"
              @click="$store.modal.dirty = false; $dispatch('open-modal')">
        Снять
      </button>
    {% else %}
      <button type="button" class="btn-modal-secondary btn-sm"
              hx-post="{% url 'ip_plan:regulator_entry_reactivate' entry.id %}"
              hx-vals='{"return_document_id": "{{ document.id }}"}'
              hx-target="#document-entries-body" hx-swap="none">
        Восстановить
      </button>
    {% endif %}
    <button type="button" class="btn-danger btn-sm"
            hx-post="{% url 'ip_plan:regulator_entry_delete' entry.id %}"
            hx-vals='{"return_document_id": "{{ document.id }}"}'
            hx-target="#document-entries-body" hx-swap="none"
            hx-confirm="Удалить запись «{{ entry.value }}»? Только для исправления ошибки ввода — если блокировку сняли, используйте «Снять».">
      Удалить
    </button>
  </td>
</tr>
