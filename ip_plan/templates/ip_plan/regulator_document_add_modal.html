<div class="modal-title-bar">
  <h5>Добавить письмо</h5>
  <button type="button" class="modal-close-btn" @click="$store.modal.requestClose()" aria-label="Закрыть">✕</button>
</div>
<form hx-post="{% url 'ip_plan:regulator_document_add' %}" hx-target="#modal-content" hx-swap="innerHTML" hx-indicator="#modal-spinner">
  {% csrf_token %}
  <div class="modal-body-pad">
    {% if form.non_field_errors %}
      <div class="alert-modal-error">{{ form.non_field_errors }}</div>
    {% endif %}
    <div class="field-group">
      <div class="row g-2">
        <div class="col-md-6">
          <label class="field-label">{{ form.reference_no.label }}</label>
          {{ form.reference_no }}
          {{ form.reference_no.errors }}
        </div>
        <div class="col-md-6">
          <label class="field-label">{{ form.document_date.label }}</label>
          {{ form.document_date }}
          {{ form.document_date.errors }}
        </div>
        <div class="col-12">
          <label class="field-label">{{ form.note.label }}</label>
          {{ form.note }}
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer-bar">
    <button type="button" class="btn-modal-secondary" @click="$store.modal.requestClose()">Отмена</button>
    <button type="submit" class="btn-modal-primary">Добавить</button>
  </div>
</form>
