{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IP Plan — Вход</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'ip_plan/css/style.css' %}">
  <style>
    /* Только эта страница: form/card по центру экрана, без навигации и
       без хедера/тулбара остального приложения (см. base.html). */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-page);
    }
    .login-card {
      background: #fff;
      border: 1px solid var(--border-soft);
      border-radius: 24px;
      box-shadow: 0 24px 48px rgba(22, 29, 37, .12);
      width: 360px;
      max-width: 92vw;
      padding: 2rem 2.2rem;
    }
    .login-title {
      margin: 0 0 1.4rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
    }
    .login-field { margin-bottom: 1rem; }
    .login-submit { width: 100%; margin-top: .3rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1 class="login-title">IP Plan — Вход</h1>

    {% if form.errors %}
      <div class="alert-modal-error">
        Неверный логин или пароль. Для входа через FreeIPA нужно ещё и состоять
        в группе netbox-users.
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="login-field">
        <label class="field-label" for="id_username">Логин</label>
        <input class="field-control" type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="login-field">
        <label class="field-label" for="id_password">Пароль</label>
        <input class="field-control" type="password" name="password" id="id_password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn-modal-primary login-submit">Войти</button>
    </form>
  </div>
</body>
</html>
