{% extends "ip_plan/base.html" %}

{% block content %}
  <section class="hero">
    <div class="hero-title-row">
      <h1 class="title">ACL</h1>
    </div>
    <p class="subtitle">
      Поиск по running-config Cisco-устройств (config_backups, без записи в NetBox) —
      какие ACL-правила трогают заданный IP, источник или назначение.
    </p>
  </section>

  <form class="page-toolbar"
        hx-get="{% url 'ip_plan:acl_lookup' %}"
        hx-target="#acl-page-body"
        hx-swap="outerHTML"
        hx-push-url="true"
        hx-indicator="#acl-search-spinner">
    <div class="toolbar-left">
      <div class="toolbar-input-wrap">
        <input type="text" name="ip" class="toolbar-input" placeholder="Например, 178.162.194.210"
               value="{{ ip_query }}" autocomplete="off">
      </div>
      <select name="device" class="toolbar-input"
              hx-get="{% url 'ip_plan:acl_lookup' %}"
              hx-target="#acl-page-body"
              hx-swap="outerHTML"
              hx-trigger="change"
              hx-push-url="true"
              hx-include="closest form"
              hx-indicator="#acl-search-spinner"
              title="Фильтр по устройству">
        <option value="">Все устройства</option>
        {% for dev in device_choices %}
          <option value="{{ dev }}" {% if dev == selected_device %}selected{% endif %}>{{ dev }}</option>
        {% endfor %}
      </select>
      <button type="submit" class="btn-add">Найти</button>
      <span id="acl-search-spinner" class="htmx-indicator">Поиск…</span>
    </div>
  </form>

  {% include "ip_plan/_acl_page_body.html" %}
{% endblock %}
