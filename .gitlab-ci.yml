stages:
  - deploy

deploy:
  stage: deploy
  tags:
    - ip_plan_react_shell
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
  script:
    - |
      cat > .env <<EOF
      SECRET_KEY=$SECRET_KEY
      DEBUG=$DEBUG
      ALLOWED_HOSTS=$ALLOWED_HOSTS
      CSRF_TRUSTED_ORIGINS=$CSRF_TRUSTED_ORIGINS
      USE_X_FORWARDED_PROTO=$USE_X_FORWARDED_PROTO
      SESSION_COOKIE_NAME=ipplanreact_sessionid
      CSRF_COOKIE_NAME=ipplanreact_csrftoken
      NETBOX_URL=$NETBOX_URL
      NETBOX_TOKEN=$NETBOX_TOKEN
      NETBOX_VERIFY_SSL=$NETBOX_VERIFY_SSL
      NETBOX_TIMEOUT=$NETBOX_TIMEOUT
      NETBOX_SITE_FILTER=$NETBOX_SITE_FILTER
      NETBOX_TAG_FILTER=$NETBOX_TAG_FILTER
      NETBOX_DNS_SERVERS=$NETBOX_DNS_SERVERS
      NETBOX_DNS_SKIP_PATTERN=$NETBOX_DNS_SKIP_PATTERN
      URL_PREFIX=$URL_PREFIX
      LDAP_BIND_PASSWORD=$LDAP_BIND_PASSWORD
      NETBOX_SYNC_DIR=$NETBOX_SYNC_DIR
      POSTGRES_HOST_PORT=$POSTGRES_HOST_PORT
      SEED_LOCAL_ADMIN=${SEED_LOCAL_ADMIN:-true}
      IP_PLAN_DB_ENGINE=${IP_PLAN_DB_ENGINE:-sqlite}
      IP_PLAN_DB_HOST=postgres
      IP_PLAN_DB_PORT=5432
      IP_PLAN_DB_NAME=ip_plan
      IP_PLAN_DB_USER=ip_plan
      IP_PLAN_DB_PASSWORD=$IP_PLAN_DB_PASSWORD
      NETOBS_RO_HOST=postgres
      NETOBS_RO_PORT=5432
      NETOBS_RO_NAME=netobs
      NETOBS_RO_USER=ip_plan_ro
      NETOBS_RO_PASSWORD=$NETOBS_RO_PASSWORD
      EOF
    # Секреты PostgreSQL — отдельный файл только для контейнера postgres
    # (env_file в docker-compose.yml), чтобы пароль суперпользователя и
    # владельца netobs не попадали в окружение web. Без этого шага compose
    # не стартует вовсе (env_file обязателен). Пустые пароли отсекаются до
    # записи файла: bootstrap.sh на них тоже остановится, но initdb к тому
    # моменту уже создаст кластер, и после рестарта образ init-скрипты не
    # повторит — postgres окажется «здоров» без ролей и баз.
    # POSTGRES_PASSWORD действует только на пустом томе; пароли ролей
    # применяются к существующему тому ручным запуском bootstrap.sh
    # (см. .env.db.example).
    # umask в подшелле: файл получает 0600, а остальные шаги скрипта
    # (одна сессия shell на весь job) — прежнюю маску.
    - |
      for var in POSTGRES_PASSWORD IP_PLAN_DB_PASSWORD NETBOX_SYNC_DB_PASSWORD NETOBS_RO_PASSWORD SYNC_WORKER_DB_PASSWORD; do
        if [ -z "$(printenv "$var")" ]; then
          echo "CI-переменная $var не задана — деплой остановлен до запуска PostgreSQL"
          exit 1
        fi
      done
    - |
      (umask 077; cat > .env.db <<EOF
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      IP_PLAN_DB_PASSWORD=$IP_PLAN_DB_PASSWORD
      NETBOX_SYNC_DB_PASSWORD=$NETBOX_SYNC_DB_PASSWORD
      NETOBS_RO_PASSWORD=$NETOBS_RO_PASSWORD
      SYNC_WORKER_DB_PASSWORD=$SYNC_WORKER_DB_PASSWORD
      EOF
      )
    - docker compose up -d --build
    - |
      ok=""
      smoke_host="${ALLOWED_HOSTS%%,*}"
      for i in $(seq 1 10); do
       if curl -fsS -H "Host: $smoke_host" http://localhost:8090/ -o /dev/null; then
          ok=1
          break
        fi
        echo "Waiting for app..."
        sleep 3
      done
      if [ -z "$ok" ]; then
        echo "App did not respond after deploy"
        docker compose logs --tail=100 web
        exit 1
      fi
      echo "App is up"
    - docker image prune -f
