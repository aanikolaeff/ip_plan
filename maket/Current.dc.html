<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <style>
    :root {
      --bg-page: #f6f8fb;
      --border-soft: rgba(24, 33, 47, .08);
      --border-soft-strong: rgba(24, 33, 47, .16);
      --accent: #1f6feb;
      --accent-strong: #1558c4;
      --text-main: #18212f;
      --text-muted: #657287;
      --text-faint: #92a0b5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: var(--text-main); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-strong); }
    .page {
      background: linear-gradient(180deg, #f8fbff 0%, #f4f7fb 100%);
      padding: 28px 40px 0;
      min-height: 100%;
    }
    .user-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: .55rem;
      margin-bottom: .65rem;
    }
    .user-bar-name { font-size: .8rem; color: var(--text-muted); }
    .user-bar-btn {
      background: rgba(255,255,255,.9); color: var(--text-main);
      border: 1px solid var(--border-soft-strong); border-radius: 999px;
      padding: .3rem .8rem; font-weight: 600; font-size: .8rem; font-family: inherit;
    }
    .hero { margin-bottom: 1.25rem; }
    .hero-title-row { display: flex; align-items: center; gap: 1.25rem; }
    .hero .title { font-size: 1.875rem; line-height: 1.1; font-weight: 700; margin: 0; letter-spacing: -.02em; }
    .btn-add {
      background: rgba(31,111,235,.04); color: var(--accent); border: 1.5px solid var(--accent);
      border-radius: 999px; padding: .6rem 1.3rem; font-weight: 600; font-size: .875rem; font-family: inherit;
    }
    .hero-stats { display: flex; align-items: baseline; gap: .9rem; margin-top: .65rem; }
    .hero-stat { color: var(--text-muted); font-size: .85rem; }
    .hero-stat strong { color: var(--text-main); font-size: 1.2rem; font-weight: 700; margin-right: .35rem; }
    .hero-stat-sep { width: 1px; height: 1rem; background: var(--border-soft-strong); }
    .hero-actions-row { display: flex; align-items: center; gap: .5rem; align-self: center; }
    .btn-help {
      width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border-soft-strong);
      background: rgba(255,255,255,.9); color: var(--text-muted); font-size: .95rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .table-head-preview {
      background: var(--bg-page);
      border-bottom: 1px solid var(--border-soft-strong);
      border-radius: 24px 24px 0 0;
      padding: .7rem .9rem;
      font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-muted);
      display: flex; gap: 2.5rem;
      margin-top: .3rem;
    }

    /* --- callout badges --- */
    .callout {
      position: absolute;
      width: 22px; height: 22px; border-radius: 50%;
      background: #dc2626; color: #fff;
      font-size: .75rem; font-weight: 700; font-family: 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(220,38,38,.4);
    }
    .callout-ring {
      position: absolute;
      border: 1.5px dashed #dc2626;
      border-radius: 10px;
      pointer-events: none;
    }
  </style>
</helmet>
<div class="page" style="position: relative; width: 1440px; height: 520px;">

  <div class="user-bar" style="position: relative;">
    <span class="user-bar-name">a.nikolaev</span>
    <button class="user-bar-btn">Выйти</button>
    <div class="callout" style="right: -34px; top: -6px;">1</div>
  </div>
  <div class="callout-ring" style="right: -6px; top: -4px; width: 168px; height: 34px;"></div>

  <section class="hero">
    <div class="hero-title-row">
      <h1 class="title">IP план</h1>
      <button class="btn-add">+ Добавить IP</button>
    </div>
    <div class="hero-stats" style="position: relative;">
      <span class="hero-stat"><strong>842</strong> Всего IP</span>
      <span class="hero-stat-sep"></span>
      <span class="hero-stat"><strong>701</strong> Активных</span>
      <span class="hero-stat-sep"></span>
      <span class="hero-stat"><strong>141</strong> Неактивных</span>
      <span class="hero-stat-sep"></span>
      <div class="hero-actions-row" style="position: relative;">
        <span class="btn-help" title="Справочник «Операционная система»">🖴</span>
        <span class="btn-help" title="Справка">?</span>
        <span class="btn-help" title="Поиск по ACL Cisco-устройств">🛡</span>
        <span class="btn-help" title="Экспорт в Excel">⇩</span>
        <div class="callout" style="right: -34px; top: -2px;">2</div>
      </div>
    </div>
  </section>
  <div class="callout-ring" style="left: 372px; top: 106px; width: 176px; height: 40px;"></div>

  <div style="position: relative;">
    <div class="table-head-preview">
      <span>Адрес (IP)</span><span>Статус</span><span>DNS-имя</span><span>Роль</span><span>Описание</span>
    </div>
    <div class="callout" style="left: -34px; top: 6px;">3</div>
  </div>

</div>
</x-dc>
</body>
</html>
