services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    # 8090 — отдельный порт от ip_plan_docker (8050): параллельный стенд для
    # сравнения React-переписи таблицы с оригиналом, тот не трогаем.
    ports:
      - "8090:8000"
    env_file:
      - .env
    restart: unless-stopped
    # Ждём не просто запуска контейнера postgres, а healthcheck: на пустом
    # томе первый старт включает init (bootstrap ролей и баз), и до его конца
    # web не должен пытаться подключиться. Пока settings.py работает на
    # SQLite (IP_PLAN_DB_ENGINE=sqlite, см. план этапа 1), зависимость
    # ничего не ломает — просто postgres поднимается вместе с web.
    depends_on:
      postgres:
        condition: service_healthy
    # host.docker.internal на Docker Desktop работает "из коробки", на
    # обычном Linux Docker Engine — только с этой записью (Docker 20.10+).
    # mdc-ipa-* — статически, чтобы login занимал миллисекунды, а не ~4с:
    # glibc getaddrinfo() по умолчанию спрашивает И A, И AAAA, а корпоративный
    # DNS на AAAA-запрос для этих хостов не отвечает (не NXDOMAIN, а просто
    # тишина) — getaddrinfo ждёт таймаут (~4с) и только потом отдаёт A-запись.
    # /etc/hosts проверяется раньше DNS и отдаёт адрес мгновенно, минуя это
    # ожидание целиком. Если IP сменится на стороне FreeIPA — обновить тут.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "mdc-ipa-1.sicmt.local:10.1.113.1"
      - "mdc-ipa-2.sicmt.local:10.1.113.2"
    # С LDAP-логином (django-auth-ldap) тут реально хранятся сессии и
    # зеркало User из LDAP — без volume'а они терялись бы при каждой
    # пересборке контейнера (`up -d --build`).
    #
    # ./admin — bind mount (не named volume), специально для файлов
    # справочников/настроек, которые правит человек напрямую на хосте
    # (например ip_plan/services/os_catalog.py: admin/os_catalog.json).
    # В отличие от sqlite_data, эта папка видна и редактируема прямо в
    # файловой системе проекта, не только изнутри контейнера.
    volumes:
      - sqlite_data:/app/data
      - ./admin:/app/admin
      # Страница "ACL", сводка netbox-sync в "Настройках" и генератор
      # CLI-команд firewall на странице "Блокировки" читают файлы, которые
      # netbox-sync пишет при каждом full_sync.sh — read-only, этот
      # контейнер туда никогда не пишет. NETBOX_SYNC_DIR — путь до корня
      # netbox-sync НА ХОСТЕ (не внутри контейнера): дефолт — соседняя
      # директория на диске разработчика (локальный чекаут, обе директории
      # рядом); на проде это НЕ соседняя директория (GitLab-раннер чекаутит
      # ip_plan_react и netbox-sync в независимые build-директории под
      # /home/gitlab-runner/builds/<runner>/...) — там NETBOX_SYNC_DIR
      # обязателен и указывает на /opt/scan (DEPLOY_PATH из netbox-sync, см.
      # CLAUDE.md), задаётся CI/CD-переменной проекта (.gitlab-ci.yml
      # прокидывает её в .env как и остальные). Без этого на проде оба mount'а
      # молча резолвились бы в пустую директорию — именно так и было с
      # config_backups до того, как это поправили при добавлении второй
      # строчки (sync_logs) ниже.
      - ${NETBOX_SYNC_DIR:-../netbox-sync}/config_backups:/app/config_backups:ro
      - ${NETBOX_SYNC_DIR:-../netbox-sync}/sync_logs:/app/sync_logs:ro
      - ${NETBOX_SYNC_DIR:-../netbox-sync}/firewall_blocklists:/app/firewall_blocklists:ro
      # Карта сети: сводка прогона топологии (topology.json, unconfirmed_cables.json).
      - ${NETBOX_SYNC_DIR:-../netbox-sync}/lldp_snapshots:/app/lldp_snapshots:ro
      # Реестр платформ (registry/platforms.json): списки парсеров и их
      # возможностей в «Настройках». Каталог, а не файл — см.
      # NETBOX_SYNC_REGISTRY_DIR в config/settings.py.
      - ${NETBOX_SYNC_DIR:-../netbox-sync}/registry:/app/netbox_sync_registry:ro
      # Единственный mount из netbox-sync, открытый НА ЗАПИСЬ: раздел
      # "Настройки" правит conf/devices.json, conf/config.json и оба
      # conf/sources_*.json (см. ip_plan/services/sync_config.py). Именно
      # директория conf/, а не корень netbox-sync — контейнер физически не
      # должен иметь возможности писать в код синка, который туда же
      # деплоит GitLab CI. Отдельные файлы монтировать нельзя: запись идёт
      # через tmp+rename, а на bind-mount'е файла rename ломается.
      - ${NETBOX_SYNC_DIR:-../netbox-sync}/conf:/app/netbox_sync_conf

  # --- PostgreSQL: база ip_plan (Django) и база netobs (наблюдения netbox-sync) ---
  # Одна СУБД, две базы с разными владельцами (KTD1/KTD4 плана
  # docs/plans/2026-10-03-0059-feat-observations-store-stage1-plan.md):
  # роли и права создаёт db/bootstrap.sh — автоматически на пустом томе и
  # вручную на существующем (`docker compose exec postgres bash
  # /opt/ip_plan_db/bootstrap.sh`). Отдельный контейнер, а не PostgreSQL
  # боевого NetBox: боевую СУБД не трогаем, локально и на проде одинаково.
  postgres:
    image: postgres:18
    # Секреты СУБД — только здесь, отдельным файлом .env.db: пароль
    # суперпользователя и пароли ролей нужны только bootstrap.sh. Контейнер
    # web получает из .env лишь свои параметры подключения (IP_PLAN_DB_*,
    # NETOBS_RO_*) — ни POSTGRES_PASSWORD, ни пароля владельца netobs у
    # веб-приложения нет.
    env_file:
      - .env.db
    # Образ 18 хранит данные в /var/lib/postgresql/18/docker и ждёт том на
    # /var/lib/postgresql — монтирование на .../data, как у старых версий,
    # он отвергает при старте (сделано ради pg_upgrade --link между версиями).
    #
    # ./db — только чтение: bootstrap.sh для ручного запуска, initdb/ —
    # обёртка, которую образ выполняет на пустом томе.
    volumes:
      - pg_data:/var/lib/postgresql
      - ./db:/opt/ip_plan_db:ro
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    # Только loopback, как у guacamole: netbox-sync на том же хосте ходит в
    # netobs на 127.0.0.1:5433, а снаружи порт не виден. 5433, а не 5432 —
    # на проде 5432, вероятно, занят системным PostgreSQL боевого NetBox.
    # Изнутри compose (web) — postgres:5432, публикация для этого не нужна.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    # -h 127.0.0.1 — проверка по TCP, а не через сокет: во время init образ
    # поднимает временный сервер, слушающий только unix-сокет, и проверка
    # через сокет объявила бы контейнер healthy ДО окончания bootstrap.sh.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -t 2 -h 127.0.0.1 -U postgres -d postgres"]
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    restart: unless-stopped

  # --- Шлюз удалённого доступа (Apache Guacamole): SSH / RDP / VNC в браузере ---
  # Оба сервиса — в профиле "gateway": обычный `docker compose up -d` (в том
  # числе деплой из .gitlab-ci.yml) их НЕ поднимает. Включить —
  # COMPOSE_PROFILES=gateway в .env либо `docker compose --profile gateway up -d`.
  # Без ключа GUACAMOLE_JSON_SECRET_KEY пунктов «в браузере» в меню строки нет,
  # приложение работает как раньше (см. ip_plan/services/remote_gateway.py).
  #
  # guacd сам говорит с хостами по SSH/RDP/VNC — наружу не публикуется.
  guacd:
    image: guacamole/guacd:1.6.0
    profiles: ["gateway"]
    restart: unless-stopped

  # Веб-клиент с расширением auth-json, БЕЗ базы данных: пользователей и
  # соединений в Guacamole нет, каждое соединение приходит в подписанном
  # токене от ip_plan. Порт слушает только loopback: локально вкладка
  # открывается на http://localhost:8091/guacamole, на проде сюда проксирует
  # nginx хоста (location /guac/, нужен WebSocket upgrade).
  guacamole:
    image: guacamole/guacamole:1.6.0
    profiles: ["gateway"]
    depends_on:
      - guacd
    environment:
      GUACD_HOSTNAME: guacd
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${GUACAMOLE_JSON_SECRET_KEY:-}
    ports:
      - "127.0.0.1:8091:8080"
    restart: unless-stopped

  # --- Сборщик заданий синка (netbox-sync/worker.py) ---
  # Берёт задания из базы ip_plan (таблицы sync_job/sync_schedule, роль
  # sync_worker) и выполняет шаги белого списка netbox-sync/worker_steps.py;
  # nmap остаётся в cron хоста. Профиль "worker": обычный `docker compose up -d`
  # (и деплой из .gitlab-ci.yml) его не поднимает. Работает только при
  # IP_PLAN_DB_ENGINE=postgres — заданиям нужна база ip_plan в PostgreSQL.
  # Включить — COMPOSE_PROFILES=worker в .env (через запятую с gateway) либо
  # `docker compose --profile worker up -d worker`.
  worker:
    # Образ — только Python и зависимости из netbox-sync/requirements.txt;
    # Dockerfile лежит в netbox-sync. Пересобирать при смене requirements.txt
    # (`docker compose --profile worker build worker`), смена кода пересборки
    # не требует: код смонтирован ниже.
    build:
      context: ${NETBOX_SYNC_DIR:-../netbox-sync}
      dockerfile: docker/worker.Dockerfile
    profiles: ["worker"]
    # worker.py — главный процесс под tini: SIGTERM от stop доходит до него,
    # он гасит группу процессов текущего шага (SIGTERM, 15 с, SIGKILL) и
    # помечает задание interrupted. Ждём дольше этой паузы, иначе docker
    # убьёт сборщик раньше, чем тот допишет итог в базу.
    init: true
    stop_grace_period: 40s
    # Выход 3 — сменилась VERSION кода (деплой netbox-sync): перезапуск
    # поднимает сборщик уже на новом коде.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Только свой пароль: .env.worker содержит одну строку
    # SYNC_WORKER_DB_PASSWORD (то же значение, что в .env.db). Ни .env
    # (секреты web), ни .env.db (суперпользователь и владельцы баз) сюда не
    # подключаются. Пароль netobs (роль netbox_sync) сборщик и шаги берут из
    # conf/netobs.json, токен NetBox и учётки устройств — из conf/ же.
    # required: false — без файла compose не падает для остальных сервисов,
    # а сам сборщик при старте скажет, что пароля нет.
    env_file:
      - path: .env.worker
        required: false
    environment:
      # local | prod — с каким --env сборщик запускает шаги. Обязательна,
      # пусто — сборщик не стартует.
      NETBOX_SYNC_ENV: ${NETBOX_SYNC_ENV:-}
      # Адреса изнутри compose (KTD16): netobs — сервис postgres, а не
      # 127.0.0.1:5433 из conf/netobs.json; NetBox — адрес, по которому его
      # видно из контейнера (локально http://host.docker.internal:8000).
      # Пусто — netbox_url из conf/config.json как есть.
      NETOBS_HOST: postgres
      NETOBS_PORT: "5432"
      NETBOX_SYNC_NETBOX_URL: ${NETBOX_SYNC_NETBOX_URL:-}
      # Отчёты vCenter/RedVirt: корень кода смонтирован только на чтение.
      NETBOX_SYNC_REPORTS_DIR: /opt/scan/reports
      # Пояс суточных расписаний и время в логах шагов — как у cron хоста.
      SYNC_LOG_TZ: ${SYNC_LOG_TZ:-Europe/Moscow}
      TZ: ${SYNC_LOG_TZ:-Europe/Moscow}
      PYTHONDONTWRITEBYTECODE: "1"
    # /health (порт 8090) — только внутри compose, на хост не публикуется.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    # host.docker.internal — NetBox на хосте (как у web); mdc-ipa-* — LDAP
    # для шага DNS enrich, статически по той же причине, что у web.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "mdc-ipa-1.sicmt.local:10.1.113.1"
      - "mdc-ipa-2.sicmt.local:10.1.113.2"
    # Без IPv6 в контейнере: корпоративный DNS не отвечает на AAAA-запросы
    # (см. extra_hosts у web), и каждое разрешение имени ждёт таймаут ~4 с.
    # Шаги ходят к гипервизорам по именам и без пула соединений — RedVirt
    # вместо ~7 минут шёл больше часа (дымовой прогон 04.10.2026). С
    # выключенным IPv6 urllib3 (requests) спрашивает только A-записи.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    # Код netbox-sync — только на чтение (KTD2), вместе с conf/ (сборщик и
    # шаги конфигурацию только читают; правит её web через свой mount).
    # Поверх — каталоги вывода на запись: туда же, куда пишет ручной запуск
    # на хосте, поэтому ip_plan видит результат заданий там же, где раньше.
    # SSH-ключей не монтируется: шаги ходят на устройства по паролям из
    # conf/devices.json, conf/ssh_access.json синк пока не читает.
    volumes:
      - ${NETBOX_SYNC_DIR:-../netbox-sync}:/opt/scan:ro
      - ${NETBOX_SYNC_DIR:-../netbox-sync}/config_backups:/opt/scan/config_backups
      - ${NETBOX_SYNC_DIR:-../netbox-sync}/lldp_snapshots:/opt/scan/lldp_snapshots
      - ${NETBOX_SYNC_DIR:-../netbox-sync}/firewall_blocklists:/opt/scan/firewall_blocklists
      - ${NETBOX_SYNC_DIR:-../netbox-sync}/sync_logs:/opt/scan/sync_logs
      - ${NETBOX_SYNC_DIR:-../netbox-sync}/reports:/opt/scan/reports

volumes:
  # sqlite_data остаётся и после перехода на PostgreSQL: из него переносятся
  # данные (dumpdata), и на него же откатываются сменой IP_PLAN_DB_ENGINE.
  sqlite_data:
  pg_data:
